services:
  api:
    image: ${NOTESOLVE_API_IMAGE:-ghcr.io/exelenta/notesolve-api}:${NOTESOLVE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NOTESOLVE_ENV: production
      NOTESOLVE_DATA_DIR: /data
      NOTESOLVE_VAULT_DIR: /vault
      NOTESOLVE_AI_PROVIDER: ${NOTESOLVE_AI_PROVIDER:-fake}
      NOTESOLVE_OPENAI_API_KEY: ${NOTESOLVE_OPENAI_API_KEY:-}
      NOTESOLVE_OPENAI_MODEL: ${NOTESOLVE_OPENAI_MODEL:-gpt-5.4}
      NOTESOLVE_OPENAI_VERIFICATION_MODEL: ${NOTESOLVE_OPENAI_VERIFICATION_MODEL:-}
      NOTESOLVE_OPENAI_NOTE_EDITOR_MODEL: ${NOTESOLVE_OPENAI_NOTE_EDITOR_MODEL:-}
      NOTESOLVE_OPENAI_MAX_RETRIES: ${NOTESOLVE_OPENAI_MAX_RETRIES:-2}
      NOTESOLVE_VERIFICATION_ENABLED: ${NOTESOLVE_VERIFICATION_ENABLED:-true}
      NOTESOLVE_VERIFICATION_THRESHOLD: ${NOTESOLVE_VERIFICATION_THRESHOLD:-0.9}
      NOTESOLVE_ALLOWED_HOSTS: ${NOTESOLVE_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      NOTESOLVE_CORS_ORIGINS: ${NOTESOLVE_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - type: bind
        source: ${NOTESOLVE_DATA_DIR:-/opt/notesolve/data}
        target: /data
      - type: bind
        source: ${NOTESOLVE_VAULT_DIR:-/opt/notesolve/vault}
        target: /vault
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${NOTESOLVE_WEB_IMAGE:-ghcr.io/exelenta/notesolve-web}:${NOTESOLVE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NOTESOLVE_BIND_ADDRESS:-127.0.0.1}:${NOTESOLVE_WEB_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true

